name: ${COMPOSE_PROJECT_NAME}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  volume-init:
    image: ${ALPINE_IMAGE}
    network_mode: none
    restart: "no"
    volumes:
      - orchestrator-socket:/volumes/orchestrator
      - lab-nginx-config:/volumes/lab-nginx
      - ./deploy/volume-init/init-volumes.sh:/opt/platform/init-volumes.sh:ro
    command: ["/bin/sh", "/opt/platform/init-volumes.sh"]
    logging: *default-logging

  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE}
    environment:
      CONTAINERS: "1"
      DELETE: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - orchestration-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  shared-mysql:
    build:
      context: .
      dockerfile: database/mysql/Dockerfile
      args:
        MYSQL_IMAGE: ${MYSQL_IMAGE}
    command:
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_PLATFORM_DATABASE}
      MYSQL_USER: ${MYSQL_PLATFORM_USER}
      MYSQL_PASSWORD: ${MYSQL_PLATFORM_PASSWORD}
      MYSQL_PLATFORM_DATABASE: ${MYSQL_PLATFORM_DATABASE}
      MYSQL_PLATFORM_USER: ${MYSQL_PLATFORM_USER}
      MYSQL_ORCHESTRATOR_USER: ${MYSQL_ORCHESTRATOR_USER}
      MYSQL_ORCHESTRATOR_PASSWORD: ${MYSQL_ORCHESTRATOR_PASSWORD}
      SEED_TEST_USERS: ${SEED_TEST_USERS}
      TZ: ${TZ}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - platform-data-net
      - db-admin-net
      - mysql-host-access-net
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  database-migrate:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_HOST: shared-mysql
      MYSQL_PORT: "3306"
      MYSQL_PLATFORM_DATABASE: ${MYSQL_PLATFORM_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./scripts/mysql_migrate.sh:/opt/platform/mysql_migrate.sh:ro
      - ./database/mysql/migrations:/opt/platform/migrations:ro
    networks:
      - platform-data-net
    depends_on:
      shared-mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/platform/mysql_migrate.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOPROXY: ${GOPROXY}
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      ORCHESTRATOR_SOCKET_PATH: ${ORCHESTRATOR_SOCKET_PATH}
      ORCHESTRATOR_TEMPLATE_ROOT: /opt/platform/configs
      ORCHESTRATOR_DOCKER_TIMEOUT: ${ORCHESTRATOR_DOCKER_TIMEOUT:-20s}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.47}
      MYSQL_HOST: shared-mysql
      MYSQL_PORT: "3306"
      MYSQL_PLATFORM_DATABASE: ${MYSQL_PLATFORM_DATABASE}
      MYSQL_ORCHESTRATOR_USER: ${MYSQL_ORCHESTRATOR_USER}
      MYSQL_ORCHESTRATOR_PASSWORD: ${MYSQL_ORCHESTRATOR_PASSWORD}
      LAB_DATABASE_PASSWORD_SECRET: ${LAB_DATABASE_PASSWORD_SECRET:-}
      LAB_APP_IMAGE: ${LAB_APP_IMAGE}
      REDIS_IMAGE: ${REDIS_IMAGE}
      LAB_GATEWAY_COMPOSE_SERVICE: lab-gateway-nginx
      MYSQL_COMPOSE_SERVICE: shared-mysql
      LAB_MAX_ACTIVE: ${LAB_MAX_ACTIVE:-10}
      LAB_MAX_TEMP_CONTAINERS: ${LAB_MAX_TEMP_CONTAINERS:-40}
      LAB_MAX_INSTANCES_PER_SESSION: ${LAB_MAX_INSTANCES_PER_SESSION:-4}
      LAB_DEFAULT_CPU_CORES: ${LAB_DEFAULT_CPU_CORES:-0.1}
      LAB_DEFAULT_MEMORY_MB: ${LAB_DEFAULT_MEMORY_MB:-128}
      LAB_DEFAULT_PIDS_LIMIT: ${LAB_DEFAULT_PIDS_LIMIT:-64}
      LAB_REDIS_MEMORY_MB: ${LAB_REDIS_MEMORY_MB:-48}
      LAB_IDLE_TIMEOUT: ${LAB_IDLE_TIMEOUT:-10m}
      LAB_MAX_DURATION: ${LAB_MAX_DURATION:-30m}
      TZ: ${TZ}
    volumes:
      - orchestrator-socket:/run/platform
      - lab-nginx-config:/var/lib/platform/nginx-labs
    networks:
      - orchestration-net
      - db-admin-net
    depends_on:
      volume-init:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_healthy
      shared-mysql:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/orchestrator", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  lab-gateway-nginx:
    build:
      context: .
      dockerfile: deploy/nginx/lab-gateway/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE}
    volumes:
      - lab-nginx-config:/etc/nginx/labs
    networks:
      - lab-control-net
    depends_on:
      volume-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  platform-api:
    build:
      context: .
      dockerfile: services/platform-api/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOPROXY: ${GOPROXY}
    environment:
      PLATFORM_API_ADDR: ${PLATFORM_API_ADDR}
      MYSQL_HOST: shared-mysql
      MYSQL_PORT: "3306"
      MYSQL_PLATFORM_DATABASE: ${MYSQL_PLATFORM_DATABASE}
      MYSQL_PLATFORM_USER: ${MYSQL_PLATFORM_USER}
      MYSQL_PLATFORM_PASSWORD: ${MYSQL_PLATFORM_PASSWORD}
      ORCHESTRATOR_SOCKET_PATH: ${ORCHESTRATOR_SOCKET_PATH}
      LAB_GATEWAY_ADDR: ${LAB_GATEWAY_ADDR}
      LAB_MAX_ACTIVE: ${LAB_MAX_ACTIVE:-10}
      LAB_MAX_TEMP_CONTAINERS: ${LAB_MAX_TEMP_CONTAINERS:-40}
      LAB_MAX_INSTANCES_PER_SESSION: ${LAB_MAX_INSTANCES_PER_SESSION:-4}
      LAB_IDLE_TIMEOUT: ${LAB_IDLE_TIMEOUT:-10m}
      LAB_MAX_DURATION: ${LAB_MAX_DURATION:-30m}
      LAB_EXPIRING_LEAD: ${LAB_EXPIRING_LEAD:-1m}
      LAB_LIFECYCLE_POLL_INTERVAL: ${LAB_LIFECYCLE_POLL_INTERVAL:-5s}
      LAB_RECONCILE_INTERVAL: ${LAB_RECONCILE_INTERVAL:-1m}
      LAB_RECONCILE_CLEANUP: ${LAB_RECONCILE_CLEANUP:-true}
      TRAFFIC_REQUEST_TIMEOUT: ${TRAFFIC_REQUEST_TIMEOUT:-3s}
      TRAFFIC_RATE_PER_SECOND: ${TRAFFIC_RATE_PER_SECOND:-10}
      TRAFFIC_BURST: ${TRAFFIC_BURST:-10}
      TRAFFIC_LIMITER_MAX_ENTRIES: ${TRAFFIC_LIMITER_MAX_ENTRIES:-2048}
      LAB_OPERATION_WORKER_ID: ${LAB_OPERATION_WORKER_ID:-platform-api-1}
      LAB_OPERATION_POLL_INTERVAL: ${LAB_OPERATION_POLL_INTERVAL:-500ms}
      LAB_OPERATION_LEASE_DURATION: ${LAB_OPERATION_LEASE_DURATION:-30s}
      LAB_ORCHESTRATOR_TIMEOUT: ${LAB_ORCHESTRATOR_TIMEOUT:-20s}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_LOGIN_WINDOW: ${AUTH_LOGIN_WINDOW:-5m}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_BLOCK_DURATION: ${AUTH_LOGIN_BLOCK_DURATION:-10m}
      AUTH_LOGIN_LIMITER_MAX_ENTRIES: ${AUTH_LOGIN_LIMITER_MAX_ENTRIES:-2048}
      TZ: ${TZ}
    volumes:
      - orchestrator-socket:/run/platform:ro
    networks:
      - platform-edge-net
      - platform-data-net
      - lab-control-net
    depends_on:
      shared-mysql:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      lab-gateway-nginx:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  edge-nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    ports:
      - "${HTTP_PORT}:8080"
    networks:
      - platform-edge-net
    depends_on:
      platform-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  swagger-ui:
    build:
      context: .
      dockerfile: deploy/swagger-ui/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    networks:
      - platform-edge-net
    depends_on:
      platform-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  lab-app:
    profiles:
      - images
    image: ${LAB_APP_IMAGE}
    build:
      context: .
      dockerfile: services/lab-app/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOPROXY: ${GOPROXY}
    environment:
      LAB_APP_ADDR: :8080
      LAB_ID: unassigned
      INSTANCE_ID: unassigned
      SCENARIO_TYPE: scaffold
      TZ: ${TZ}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${LAB_DEFAULT_PIDS_LIMIT:-64}
    mem_limit: ${LAB_DEFAULT_MEMORY_MB:-128}m
    cpus: ${LAB_DEFAULT_CPU_CORES:-0.1}
    logging: *default-logging

networks:
  platform-edge-net:
    name: ${COMPOSE_PROJECT_NAME}-platform-edge-net
    driver: bridge
  platform-data-net:
    name: ${COMPOSE_PROJECT_NAME}-platform-data-net
    driver: bridge
    internal: true
  lab-control-net:
    name: ${COMPOSE_PROJECT_NAME}-lab-control-net
    driver: bridge
    internal: true
  orchestration-net:
    name: ${COMPOSE_PROJECT_NAME}-orchestration-net
    driver: bridge
    internal: true
  db-admin-net:
    name: ${COMPOSE_PROJECT_NAME}-db-admin-net
    driver: bridge
    internal: true
  mysql-host-access-net:
    name: ${COMPOSE_PROJECT_NAME}-mysql-host-access-net
    driver: bridge

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME}-mysql-data
  orchestrator-socket:
    name: ${COMPOSE_PROJECT_NAME}-orchestrator-socket
  lab-nginx-config:
    name: ${COMPOSE_PROJECT_NAME}-lab-nginx-config
